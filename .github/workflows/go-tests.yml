name: Go EngageGuard action tests

on:
  pull_request:
  push:
    branches: ['feature/**', 'fix/**']

permissions:
  contents: read

env:
  # Fail closed rather than silently downloading a different toolchain.
  GOTOOLCHAIN: local

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard_ci
          POSTGRES_PASSWORD: guard-ci-pass
          POSTGRES_DB: guard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guard_ci -d guard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GUARD_PG_DSN: postgres://guard_ci:guard-ci-pass@127.0.0.1:5432/guard_ci?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.11'
      - name: Assert patched Go toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.26.11"
          go version
      - run: go mod verify
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verify Python and TypeScript JCS interoperability
        run: |
          python3 scripts/verify_resolved_action_hash.py
          node --experimental-strip-types scripts/verify_resolved_action_hash.ts
      - name: Verify WorkspaceWrite v0.1 compatibility subset
        run: |
          python3 scripts/verify_workspace_jcs.py
          node --experimental-strip-types scripts/verify_workspace_jcs.ts
      - name: Check gofmt
        shell: bash
        run: |
          files="$(gofmt -l internal)"
          if [[ -n "$files" ]]; then
            echo "The following Go files need gofmt:"
            printf '%s\n' "$files"
            gofmt -d $files
            exit 1
          fi
